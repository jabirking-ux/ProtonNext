name: Check Upstream Changes

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    name: Check Upstream Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Upstream Status
        id: check_upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import urllib.request, json, os, sys

          status_file = 'upstream_status.json'
          if os.path.exists(status_file):
              with open(status_file, 'r') as f:
                  current = json.load(f)
          else:
              current = {'win-app': '', 'ProtonVPN-Next-CLI': ''}

          headers = {'User-Agent': 'ProtonNext-Sync-Bot'}
          token = os.getenv('GITHUB_TOKEN')
          if token:
              headers['Authorization'] = f'token {token}'

          def get_latest_commit(repo):
              url = f'https://api.github.com/repos/{repo}/commits/master'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      return data['sha'], data['commit']['message'].split('\n')[0], data['html_url']
              except Exception as e:
                  print(f'Error fetching {repo}: {e}')
                  return None, None, None

          win_sha, win_msg, win_url = get_latest_commit('ProtonVPN/win-app')
          cli_sha, cli_msg, cli_url = get_latest_commit('SMH01-MOD-NEXT/ProtonVPN-Next-CLI')

          changed = False
          report = []

          if win_sha and win_sha != current.get('win-app'):
              changed = True
              report.append(f'- **ProtonVPN/win-app**: New commit [{win_sha[:7]}]({win_url}): *{win_msg}* (was `{current.get(\"win-app\", \"none\")[:7]}`)')
              current['win-app'] = win_sha

          if cli_sha and cli_sha != current.get('ProtonVPN-Next-CLI'):
              changed = True
              report.append(f'- **SMH01-MOD-NEXT/ProtonVPN-Next-CLI**: New commit [{cli_sha[:7]}]({cli_url}): *{cli_msg}* (was `{current.get(\"ProtonVPN-Next-CLI\", \"none\")[:7]}`)')
              current['ProtonVPN-Next-CLI'] = cli_sha

          with open(status_file, 'w') as f:
              json.dump(current, f, indent=2)

          with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
              f.write(f'changed={str(changed).lower()}\n')
              if changed:
                  body = '\n'.join(report)
                  body_escaped = body.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  f.write(f'report={body_escaped}\n')
          "

      - name: Create Issue on Upstream Changes
        if: steps.check_upstream.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.REPORT;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream Updates Available in Dependencies',
              body: `### New Upstream Changes Detected\n\nThe following upstream repositories have updated commits:\n\n${report}\n\nPlease review these changes and integrate any applicable bugfixes or enhancements into ProtonNext.`
            });
        env:
          REPORT: ${{ steps.check_upstream.outputs.report }}

      - name: Commit Updated Upstream Hashes
        if: steps.check_upstream.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upstream_status.json
          git commit -m "chore: update upstream commit tracking hashes [skip ci]"
          git push
